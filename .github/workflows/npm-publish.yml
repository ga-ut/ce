name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate publish ref
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./packages/ce/package.json').version")

          if [[ "$GITHUB_REF" == refs/tags/* && ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Publishing requires a v<semver> tag ref. Got: $GITHUB_REF"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* && "v$PACKAGE_VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION"
            exit 1
          fi

          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Package version must be semver. Got: $PACKAGE_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate and build
        run: bun run verify:full

      - name: Publish package
        run: npm publish --access public
        working-directory: packages/ce
