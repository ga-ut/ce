      <section class="card">
        <h2>Playground</h2>
        <p>
          Use this isolated workspace to test HTML, CSS, JavaScript, and CE examples quickly.
          Press <strong>Run</strong> to render the preview.
        </p>
        <p class="status">Playground code runs only in the browser and does not modify repository source files.</p>
      </section>

      <section class="card playground" aria-label="Interactive playground">
        <div class="playground__presets" role="group" aria-label="Playground presets">
          <button type="button" data-playground-preset="fine">Fine-grained counter</button>
          <button type="button" data-playground-preset="todo">Todo list</button>
          <button type="button" data-playground-preset="products">Product cards</button>
          <button type="button" data-playground-preset="tabs">Tabs</button>
          <button type="button" data-playground-preset="ce">CE + Shadow DOM</button>
          <button type="button" data-playground-preset="basic">Basic example</button>
        </div>
        <div class="playground__controls">
          <button type="button" data-playground-run>Run</button>
          <button type="button" data-playground-reset>Reset</button>
          <span class="status" data-playground-status>Ready</span>
        </div>

        <div class="playground__layout">
          <div class="playground__editors">
            <label class="code-editor">
              <span class="code-editor__bar">HTML</span>
              <span class="code-editor__body">
                <span class="code-editor__lines" aria-hidden="true"></span>
                <span class="code-editor__pane">
                  <pre class="code-editor__highlight" aria-hidden="true"><code></code></pre>
                  <textarea data-editor="html" spellcheck="false"></textarea>
                </span>
              </span>
            </label>
            <label class="code-editor">
              <span class="code-editor__bar">CSS</span>
              <span class="code-editor__body">
                <span class="code-editor__lines" aria-hidden="true"></span>
                <span class="code-editor__pane">
                  <pre class="code-editor__highlight" aria-hidden="true"><code></code></pre>
                  <textarea data-editor="css" spellcheck="false"></textarea>
                </span>
              </span>
            </label>
            <label class="code-editor">
              <span class="code-editor__bar">JS</span>
              <span class="code-editor__body">
                <span class="code-editor__lines" aria-hidden="true"></span>
                <span class="code-editor__pane">
                  <pre class="code-editor__highlight" aria-hidden="true"><code></code></pre>
                  <textarea data-editor="js" spellcheck="false"></textarea>
                </span>
              </span>
            </label>
          </div>
          <div class="playground__preview-wrap">
            <h3>Preview</h3>
            <iframe title="Playground preview" data-playground-preview sandbox="allow-scripts"></iframe>
          </div>
        </div>
      </section>
