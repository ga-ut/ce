name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - .bun-version
      - bun.lock
      - package.json
      - tsconfig.json
      - tsconfig.base.json
      - docs/site/**
      - docs/data/**
      - apps/playground/**
      - apps/ui-showcase/**
      - packages/ce/src/**
      - packages/ce/package.json
      - packages/ce/tsconfig.json
      - packages/ui/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Pages inputs
        run: bun run verify:full

      - name: Generate docs site
        run: bun run docs:build

      - name: Prepare Pages artifact (docs/site/* + docs/data + dist + UI showcase)
        run: |
          set -euo pipefail
          mkdir -p _pages_artifact

          if [[ -d docs/site ]]; then
            cp -a docs/site/. _pages_artifact/
          else
            echo "docs/site not found; skipping copy"
          fi

          if [[ -d docs/data ]]; then
            cp -a docs/data _pages_artifact/data
          else
            echo "docs/data not found; skipping copy"
          fi

          if [[ -d dist ]]; then
            cp -a dist _pages_artifact/dist
          else
            echo "dist not found; skipping copy"
          fi

          if [[ -f apps/ui-showcase/index.html && -f apps/ui-showcase/dist/app.js ]]; then
            mkdir -p _pages_artifact/ui/dist
            cp apps/ui-showcase/index.html _pages_artifact/ui/index.html
            cp -a apps/ui-showcase/dist/. _pages_artifact/ui/dist/
          else
            echo "apps/ui-showcase build output not found; cannot publish /ui"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_artifact

      - name: Deployment failure guidance
        if: failure()
        run: |
          echo "[Ops] If deployment fails, check docs/site, docs/data, and apps/ui-showcase/dist first."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Preflight - verify GitHub Pages settings
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const response = await github.rest.repos.getPages({ owner, repo });
              const buildType = response.data?.build_type;

              if (buildType !== 'workflow') {
                core.setFailed(
                  `GitHub Pages build_type is "${buildType}". Set Settings > Pages > Build and deployment > Source to "GitHub Actions".`
                );
                return;
              }

              core.info(`GitHub Pages is enabled (build_type=${buildType}).`);
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(
                  'GitHub Pages is not enabled for this repository. Enable it in Settings > Pages and set Source to "GitHub Actions".'
                );
                return;
              }

              throw error;
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment failure guidance
        if: failure()
        run: |
          echo "[Ops] First check that Settings > Pages is enabled and Source is set to GitHub Actions."
          echo "[Ops] Then check docs/site, docs/data, and apps/ui-showcase/dist path configuration."
